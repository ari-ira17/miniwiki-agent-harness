name: check

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: miniwiki
          POSTGRES_USER: miniwiki
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miniwiki -d miniwiki"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_DB: miniwiki
      POSTGRES_USER: miniwiki
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-only-admin-password
      ADMIN_FIRST_NAME: CI
      ADMIN_LAST_NAME: Administrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run python -m pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
